<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPT US — الخطوة التالية</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#edf6ff}
*{box-sizing:border-box}body{margin:0;padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}
h1{font-size:17px;margin:0}.status{font-size:12px;color:#91d4ec}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}
button{border:1px solid #466a83;background:#17263a;color:inherit;border-radius:12px;text-align:right;padding:11px;font:inherit;cursor:pointer}
button:hover{background:#233e57}.number{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:linear-gradient(120deg,#4465d6,#50c6d8);font-weight:700;margin-left:8px}
footer{color:#a9bed0;font-size:12px;margin-top:12px}
</style></head>
<body><div class="head"><h1 id="title">الخطوة التالية</h1><span class="status" id="status">بانتظار الحالة…</span></div>
<div id="workflow" hidden><p id="progress" role="status"></p><button id="pause-task" type="button">إيقاف المهمة مؤقتًا</button></div>
<div class="options" id="options" aria-live="polite"></div>
<footer>اختر رقمًا أو قل الرقم بصوتك. سيُراجع ChatGPT الصفحة أو الشاشة قبل تنفيذ الخطوة. الخيارات محفوظة محليًا عند اتصال البرنامج والإضافة.</footer>
<script>
(()=>{
  const pending=new Map();let id=1,revision=-1,alive=true;
  const title=document.getElementById('title'),status=document.getElementById('status'),options=document.getElementById('options');
  function rpc(method,params){const key=id++;return new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{pending.delete(key);reject(Error('انتهت مهلة الاتصال'));},12000);
    pending.set(key,{resolve,reject,timeout});window.parent.postMessage({jsonrpc:'2.0',id:key,method,params},'*');
  });}
  window.addEventListener('message',event=>{if(event.source!==window.parent)return;const value=event.data;
    if(!value||typeof value!=='object')return;
    if(value.id!==undefined&&pending.has(value.id)){const item=pending.get(value.id);pending.delete(value.id);clearTimeout(item.timeout);
      value.error?item.reject(Error(value.error.message||'فشل الطلب')):item.resolve(value.result);}
    if(value.method==='ui/notifications/tool-result')render(value.params?.structuredContent);
  });
  document.getElementById('pause-task').addEventListener('click',async()=>{
    try{await rpc('tools/call',{name:'workflow_pause',arguments:{}});document.getElementById('progress').textContent='تم طلب الإيقاف بعد الفعل الجاري';}
    catch(error){document.getElementById('progress').textContent=error.message;}
  });
  function render(state){if(!state||typeof state!=='object')return;revision=state.revision;
    const task=state.workflow;document.getElementById('workflow').hidden=!task;
    if(task){
      const labels={ready:'جاهزة',running:'قيد التنفيذ',paused:'متوقفة مؤقتًا',needs_review:'تحتاج تحققًا',complete:'مكتملة',cancelled:'ملغاة'};
      document.getElementById('progress').textContent=task.task+' — '+task.index+'/'+task.steps.length+' خطوات متحققة — '+(labels[task.status]||task.status)+(task.reason?' — '+task.reason:'');
    }
    title.textContent=state.title||'الخطوة التالية';status.textContent=state.phase==='working'?`جارٍ تنفيذ ${state.lastTool||'الأمر'}…`:state.phase==='error'?'تعذر تنفيذ آخر أمر':'جاهز';
    options.replaceChildren();for(const item of Array.isArray(state.options)?state.options:[]){
      if(!Number.isInteger(item.number)||item.number<0||item.number>9)continue;
      const button=document.createElement('button');button.type='button';
      const number=document.createElement('span');number.className='number';number.textContent=String(item.number);
      button.append(number,document.createTextNode(String(item.label||'الخيار')));
      button.addEventListener('click',async()=>{status.textContent='أُرسل الخيار إلى ChatGPT…';
        try{await rpc('ui/message',{role:'user',content:[{type:'text',text:`اخترت الخيار رقم ${item.number}: ${String(item.label||'')}. استخدم smart_action_choose ثم افحص الحالة الحالية ونفّذ الخطوة المناسبة.`}]});}
        catch{status.textContent=`اكتب الرقم ${item.number} في المحادثة`;} });options.append(button);
    }
  }
  async function poll(){if(!alive)return;try{const response=await rpc('tools/call',{name:'smart_action_state',arguments:{}});
      render(response?.structuredContent||response?.content?.[0]?.structuredContent);}
    catch{status.textContent='انتظار الاتصال — أعد المحاولة';}
    if(alive)setTimeout(poll,document.hidden?3000:1200);
  }
  window.addEventListener('pagehide',()=>{alive=false});poll();
})();
</script></body></html>
