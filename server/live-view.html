<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT US — عرض الكمبيوتر المباشر</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: transparent; color: #ececec; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: transparent; }
    body { padding: 14px; min-height: 0; position: relative; overflow-anchor: none; }
    .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    h1 { font-size: 16px; margin: 0 auto 0 0; }
    select, button { background: #262626; color: #ececec; border: 1px solid #444; border-radius: 9px; padding: 8px 12px; font: inherit; }
    button { cursor: pointer; }
    button:hover { background: #333; }
    .badge { color: #aaa; font-size: 13px; }
    .screen { display: grid; place-items: center; position: relative; width: 100%; height: min(67vh, 760px); min-height: 310px; margin-inline: auto; overflow: hidden; border: 0; border-radius: 8px; background: #111; }
    img, video { display: none; width: 100%; height: 100%; object-fit: contain; }
    .screen.ready.jpeg img, .screen.ready.h264 video, .screen.ready.webm video { display: block; }
    .message { position: absolute; padding: 20px; text-align: center; line-height: 1.6; color: #b6c9e3; }
    .screen.ready .message { display: none; }
    footer { margin-top: 9px; color: #9caec4; font-size: 12px; }
    .controls { position: absolute; top: 72px; inset-inline: 8px; z-index: 10; background: #181818; border: 1px solid #555; border-radius: 10px; padding: 10px; max-height: 280px; overflow: auto; overscroll-behavior: contain; }
    [hidden] { display: none !important; }
    .screen, body.expanded .screen { height: var(--live-height, 340px); min-height: 0; }
    .pad { touch-action: none; user-select: none; height: 150px; display: grid; place-items: center; background: #20202b; border: 1px dashed #8d83bb; border-radius: 10px; color: #b6c9e3; }
    .controls textarea { width: 100%; min-height: 60px; background: #222; color: white; font: 16px system-ui; border: 1px solid #555; border-radius: 8px; padding: 8px; resize: none; }
    body.expanded .screen { height: min(78vh, 900px); }
    @media (max-width: 680px) { body { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); } .bar { gap: 6px; } h1 { width: 100%; margin: 0; } select { max-width: 100%; flex: 1 1 210px; } select, button { padding: 7px 9px; } .screen { height: 58dvh; min-height: 260px; } body.expanded .screen { height: 72dvh; } }
    .screen, body.expanded .screen { height: var(--live-height,340px); min-height: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>الكمبيوتر المباشر</h1>
    <label for="monitor">الشاشة</label><select id="monitor" aria-label="اختر الشاشة"></select>
    <button id="toggle" type="button">إيقاف مؤقت</button>
    <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="controlSettings">⚙ الإعدادات</button>
    <button id="expand" type="button">تكبير داخل المحادثة</button>
    <button id="audio" type="button" hidden>تشغيل الصوت</button>
    <span class="badge" id="status" role="status">جارٍ الاتصال…</span>
  </div>
  <div class="screen" id="screen"><img id="frame" alt="عرض مباشر لشاشة الكمبيوتر"><video id="video" autoplay muted playsinline></video><div class="message" id="message">بانتظار الاتصال بالكمبيوتر…</div></div>
  <section id="controlSettings" class="controls" hidden aria-label="التحكم اليدوي بالكمبيوتر">
    <div class="bar"><button id="padToggle" type="button">لوحة لمس</button><button id="keyboardToggle" type="button">فتح الكيبورد</button><span id="controlStatus" class="badge" role="status">التحكم بالكمبيوتر والنافذة التي عليها التركيز</span></div>
    <div id="padPanel" hidden><div id="touchpad" class="pad" aria-label="لوحة لمس لتحريك ماوس الكمبيوتر">حرّك بإصبع · اضغط للنقر · إصبعان للتمرير</div><div class="bar"><button id="leftClick" type="button">نقرة يسار</button><button id="rightClick" type="button">نقرة يمين</button><button id="doubleClick" type="button">نقرتان</button></div></div>
    <div id="keyboardPanel" hidden><textarea id="remoteText" aria-label="النص المراد كتابته على الكمبيوتر" placeholder="اكتب هنا ثم اضغط إرسال النص" autocapitalize="off" spellcheck="false"></textarea><div class="bar"><button id="sendText" type="button">إرسال النص</button><button id="enterKey" type="button">Enter</button><button id="backspaceKey" type="button">⌫</button><button id="tabKey" type="button">Tab</button><button id="escapeKey" type="button">Esc</button></div></div>
  </section>
  <footer>خاص بحسابك عبر موصل GPT US. تُطلب اللقطات أثناء فتح هذه اللوحة فقط؛ لا تُنشر على رابط عام. يمكنك كتابة أوامر التحكم في محادثة ChatGPT.</footer>
  <script>
    (() => {
      const embeddedState = __GPT_US_BOOTSTRAP_STATE__;
      const pending = new Map();
      let requestId = 1;
      let active = true;
      let latest = null;
      let source = null;
      let timer = null;
      let stream = null;
      let heartbeatTimer = null;
      let pendingFrameInfo = null;
      let pendingPacketInfo = null;
      let audioContext = null;
      let audioEnabled = false;
      let nextAudioTime = 0;
      let mediaUrl = null;
      let streamKind = null;
      let waitingForInit = true;
      let resumeAfterVisibility = false;
      let mediaSource = null;
      let sourceBuffer = null;
      const videoQueue = [];
      let lastFrameAt = 0;
      let measuredFps = 0;
      const screen = document.getElementById('screen');
      const frame = document.getElementById('frame');
      const video = document.getElementById('video');
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      const select = document.getElementById('monitor');
      const toggle = document.getElementById('toggle');
      const audioButton = document.getElementById('audio');
      const expandButton = document.getElementById('expand');
      const stableViewportHeight=window.innerHeight||700;
      function sizeLive(){document.body.style.setProperty('--live-height',`${Math.round(Math.min(expandedMode?550:420,Math.max(190,stableViewportHeight*(expandedMode?.65:.42))))}px`);}
      document.getElementById('settingsToggle')?.addEventListener('click',()=>{const panel=document.getElementById('controlSettings');panel.hidden=!panel.hidden;document.getElementById('settingsToggle').setAttribute('aria-expanded',String(!panel.hidden));});
      const controlStatus=document.getElementById('controlStatus');
      const pad=document.getElementById('touchpad'), pointers=new Map();
      let padTimer=null, dx=0,dy=0;
      const sentTexts=new Map();
      function control(command,args){
        if(!active||document.hidden||stream?.readyState!==WebSocket.OPEN){controlStatus.textContent='اتصل بالبث وتابع العرض أولًا';return false;}
        const id=requestId++;stream.send(JSON.stringify({type:'control',id,command,args}));if(command==='text')sentTexts.set(id,args.text);controlStatus.textContent='جارٍ التنفيذ…';return true;
      }
      function flushPad(){if(padTimer){clearTimeout(padTimer);padTimer=null;}if(dx||dy){control('pad',{operation:'move',dx:Math.max(-1000,Math.min(1000,Math.round(dx))),dy:Math.max(-1000,Math.min(1000,Math.round(dy)))});dx=dy=0;}}
      function padClick(button='left',count=1){flushPad();control('pad',{operation:'click',dx:0,dy:0,button,count});}
      document.getElementById('padToggle')?.addEventListener('click',()=>{const panel=document.getElementById('padPanel');panel.hidden=!panel.hidden;});
      document.getElementById('keyboardToggle')?.addEventListener('click',()=>{const panel=document.getElementById('keyboardPanel');panel.hidden=!panel.hidden;if(!panel.hidden)document.getElementById('remoteText').focus({preventScroll:true});});
      pad?.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);if(pointers.size)for(const p of pointers.values())p.moved=true;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,start:performance.now(),distance:0,moved:pointers.size>0});});
      pad?.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;e.preventDefault();const mx=e.clientX-p.x,my=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;p.distance+=Math.abs(mx)+Math.abs(my);if(p.distance>6)p.moved=true;if(pointers.size>1){flushPad();if(Math.abs(my)>=2)control('pad',{operation:'scroll',dx:0,dy:0,delta:Math.round(-my*8)});}else{dx+=mx*1.5;dy+=my*1.5;if(!padTimer)padTimer=setTimeout(flushPad,50);}});
      pad?.addEventListener('pointerup',e=>{const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(p&&!p.moved&&performance.now()-p.start<450)padClick();else flushPad();});
      pad?.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);dx=dy=0;if(padTimer)clearTimeout(padTimer);padTimer=null;});
      document.getElementById('leftClick')?.addEventListener('click',()=>padClick());
      document.getElementById('rightClick')?.addEventListener('click',()=>padClick('right'));
      document.getElementById('doubleClick')?.addEventListener('click',()=>padClick('left',2));
      document.getElementById('sendText')?.addEventListener('click',()=>{const input=document.getElementById('remoteText');if(sentTexts.size)return;if(input.value.length>2000){controlStatus.textContent='أرسل حتى 2000 حرف في المرة';return;}if(input.value)control('text',{text:input.value});});
      for(const [id,key] of [['enterKey','ENTER'],['backspaceKey','BACKSPACE'],['tabKey','TAB'],['escapeKey','ESC']])document.getElementById(id)?.addEventListener('click',()=>control('key',{key}));
      let expandedMode = false;
      function playAudio(arrayBuffer, info) {
        if (!audioEnabled || !audioContext || !info?.sampleRate || !info?.channels) return;
        const bytesPerSample = Math.max(2, Number(info.bits || 32) / 8);
        const frames = Math.floor(arrayBuffer.byteLength / (bytesPerSample * info.channels));
        if (!frames) return;
        const output = audioContext.createBuffer(info.channels, frames, info.sampleRate);
        const view = new DataView(arrayBuffer);
        const isFloat = String(info.encoding || '').toLowerCase().includes('float');
        for (let frameIndex = 0; frameIndex < frames; frameIndex++) for (let channel = 0; channel < info.channels; channel++) {
          const offset = (frameIndex * info.channels + channel) * bytesPerSample;
          output.getChannelData(channel)[frameIndex] = isFloat && bytesPerSample === 4 ? view.getFloat32(offset, true) : bytesPerSample === 2 ? view.getInt16(offset, true) / 32768 : 0;
        }
        const source = audioContext.createBufferSource(); source.buffer = output; source.connect(audioContext.destination);
        if (nextAudioTime < audioContext.currentTime || nextAudioTime > audioContext.currentTime + 0.4) nextAudioTime = audioContext.currentTime + 0.03;
        source.start(nextAudioTime); nextAudioTime += output.duration;
      }
      function appendVideo(bytes, info) {
        if (!mediaSource) {
          mediaSource = new MediaSource(); mediaUrl = URL.createObjectURL(mediaSource); video.src = mediaUrl;
          const openingSource=mediaSource;
          mediaSource.addEventListener('sourceopen', () => {
            if(openingSource!==mediaSource)return;
            try {
            const codec = `video/mp4; codecs="${info.codec || 'avc1.640028'}"`;
            if (!MediaSource.isTypeSupported(codec)) { mediaFailed(); return; }
            sourceBuffer = mediaSource.addSourceBuffer(codec); sourceBuffer.mode = 'sequence';
            sourceBuffer.addEventListener('error', mediaFailed); sourceBuffer.addEventListener('updateend', flushVideo);
            flushVideo();
            } catch { mediaFailed(); }
          }, { once: true });
        }
        videoQueue.push(new Uint8Array(bytes)); flushVideo();
        streamKind='h264'; screen.classList.remove('jpeg','webm'); screen.classList.add('h264');
      }
      function appendWebm(bytes, info) {
        if (!mediaSource) {
          mediaSource = new MediaSource(); mediaUrl = URL.createObjectURL(mediaSource); video.src = mediaUrl;
          const openingSource=mediaSource;
          mediaSource.addEventListener('sourceopen', () => {
            if(openingSource!==mediaSource)return;
            try {
            const codec = info.mimeType || 'video/webm;codecs=vp8,opus';
            if (!MediaSource.isTypeSupported(codec)) { mediaFailed(); return; }
            sourceBuffer = mediaSource.addSourceBuffer(codec); sourceBuffer.mode = 'sequence';
            sourceBuffer.addEventListener('error', mediaFailed); sourceBuffer.addEventListener('updateend', flushVideo); flushVideo();
            } catch { mediaFailed(); }
          }, { once: true });
        }
        videoQueue.push(new Uint8Array(bytes)); flushVideo();
        video.muted = !audioEnabled; video.play().catch(()=>{});
        streamKind='webm'; screen.classList.remove('jpeg','h264'); screen.classList.add('webm');
      }
      function mediaFailed() {
        resetVideo();
        status.textContent='تعذر تشغيل الفيديو — جارٍ الاستعادة';
        message.textContent='بانتظار بداية فيديو قابلة للتشغيل…';
        if (source==='browser' && latest?.monitors?.length) {
          source=String(latest.monitors[0].index);select.value=source;
          if(stream?.readyState===WebSocket.OPEN)stream.send(JSON.stringify({type:'select',screen:Number(source),mode:'jpeg'}));
        }
      }
      function flushVideo() {
        if (!sourceBuffer || sourceBuffer.updating) return;
        try {
          if (sourceBuffer.buffered.length) {
            const end=sourceBuffer.buffered.end(sourceBuffer.buffered.length-1);
            if(end-video.currentTime>2)video.currentTime=Math.max(0,end-0.4);
            if(video.currentTime>20 && sourceBuffer.buffered.start(0)<video.currentTime-15) {
              sourceBuffer.remove(0,video.currentTime-10);return;
            }
          }
          if(videoQueue.length)sourceBuffer.appendBuffer(videoQueue.shift());
        } catch { mediaFailed(); }
      }
      video.addEventListener('loadeddata',()=>{
        screen.classList.add('ready');
        video.play().catch(()=>{status.textContent='اضغط متابعة لتشغيل الفيديو';});
      });
      video.addEventListener('error',mediaFailed);
      function resetVideo() {
        videoQueue.splice(0); pendingFrameInfo = null; pendingPacketInfo = null;
        sourceBuffer = null; mediaSource = null; waitingForInit=true; streamKind=null;
        if(mediaUrl){URL.revokeObjectURL(mediaUrl);mediaUrl=null;}
        try { video.pause(); video.removeAttribute('src'); video.load(); } catch {}
        frame.removeAttribute('src'); screen.classList.remove('ready','h264','jpeg','webm');
      }
      function withTimeout(promise, milliseconds) {
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('انتهت مهلة استجابة ChatGPT للوحة')), milliseconds);
          Promise.resolve(promise).then(
            value => { clearTimeout(timeout); resolve(value); },
            error => { clearTimeout(timeout); reject(error); }
          );
        });
      }
      function rpc(method, params) {
        if (method === 'tools/call' && typeof window.openai?.callTool === 'function') {
          return withTimeout(window.openai.callTool(params.name, params.arguments), params.name === 'live_view_frame' ? 20000 : 8000);
        }
        const id = requestId++;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => { pending.delete(id); reject(new Error('انتهت مهلة الاتصال')); }, 25000);
          pending.set(id, { resolve, reject, timeout });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      window.addEventListener('message', event => {
        if (event.source !== window.parent) return;
        const value = event.data;
        if (!value || typeof value !== 'object') return;
        if (value.id !== undefined && pending.has(value.id)) {
          const item = pending.get(value.id);
          pending.delete(value.id);
          clearTimeout(item.timeout);
          value.error ? item.reject(new Error(value.error.message || 'تعذر عرض الصورة')) : item.resolve(value.result);
        }
        if (value.method === 'ui/notifications/tool-result') configure(value.params?.structuredContent);
      });
      window.addEventListener('openai:set_globals', event => configure(event.detail?.globals?.toolOutput));
      function unwrap(result) {
        result=result?.call_tool_result || result?.mcp_tool_result || result;
        if(result?.structuredContent)return result.structuredContent;
        for(const item of result?.content || [])if(item.type==='text'){
          try{const value=JSON.parse(item.text);if(typeof value.connected==='boolean')return value;}catch{}
        }
        return result;
      }
      function configure(result) {
        if (!active) return;
        result = unwrap(result);
        if (!result || typeof result.connected !== 'boolean') return;
        latest = result;
        // On ChatGPT mobile, make the host's "Open GPT US" button launch the
        // authenticated HTTPS viewer instead of reopening the MCP iframe URI.
        if (result.viewerUrl && typeof window.openai?.setOpenInAppUrl === 'function') {
          try { window.openai.setOpenInAppUrl({ href: result.viewerUrl }); } catch {}
        }
        if (!result.connected) { status.textContent = 'البرنامج غير متصل — إعادة المحاولة'; message.textContent = 'شغّل برنامج GPT US على الكمبيوتر؛ ستعيد اللوحة الاتصال تلقائيًا.'; schedule(3000); return; }
        const monitors = Array.isArray(result.monitors) ? result.monitors : [];
        const previous = source;
        const options = monitors.map(m => {
          const option = document.createElement('option'); option.value = String(m.index);
          option.textContent = `${m.name} (${m.width}×${m.height})${m.primary ? ' — رئيسية' : ''}`;
          return option;
        });
        if (result.browserConnected || result.browserCapture?.connected) { const option=document.createElement('option');option.value='browser';option.textContent='Chrome/Comet — تبويب أو نافذة أو سطح المكتب';options.push(option); }
        if (!options.length) { status.textContent = 'لا توجد شاشة أو قناة متصفح متصلة'; schedule(3000); return; }
        select.replaceChildren(...options);
        const secondary = monitors.find(m => !m.primary);
        source = options.some(o=>o.value===String(previous)) ? String(previous) : result.browserCapture?.active&&options.some(o=>o.value==='browser') ? 'browser' : secondary ? String(secondary.index) : monitors[0] ? String(monitors[0].index) : 'browser';
        select.value = source;
        const selectedMonitor = monitors.find(m => String(m.index) === source);
        if (selectedMonitor?.width && selectedMonitor?.height) { screen.style.setProperty('--monitor-ratio', `${selectedMonitor.width} / ${selectedMonitor.height}`);screen.style.setProperty('--monitor-aspect', String(selectedMonitor.width/selectedMonitor.height)); }
        else { screen.style.setProperty('--monitor-ratio','16 / 9');screen.style.setProperty('--monitor-aspect','1.7778'); }
        status.textContent = 'جارٍ فتح البث المباشر…';
        message.textContent = 'بانتظار أول إطار من البث…';
        connectStream(result.streamUrl);
      }
      function schedule(delay) { clearTimeout(timer); if (active) timer = setTimeout(refreshConnection, delay); }
      function closeStream() {
        clearInterval(heartbeatTimer); heartbeatTimer = null;
        if (stream) { stream.onclose = null; stream.close(); stream = null; }
      }
      function connectStream(url) {
        if (!active || !url) { schedule(1000); return; }
        closeStream();
        stream = new WebSocket(url);
        stream.binaryType = 'arraybuffer';
        stream.onopen = () => {
          if (!active || document.hidden) { if(active&&document.hidden)resumeAfterVisibility=true;stopLeavingView(); return; }
          stream.send(JSON.stringify(source==='browser' ? { type:'select',source:'browser' } : { type: 'select', screen: Number(source), mode: 'jpeg' }));
          let lastPlayback=video.currentTime; let stalledTicks=0;
          heartbeatTimer = setInterval(() => {
            if (active && !document.hidden && stream?.readyState === WebSocket.OPEN)
              stream.send(JSON.stringify({type:'heartbeat'}));
            if(source==='browser'){
              stalledTicks=video.currentTime===lastPlayback?stalledTicks+1:0;lastPlayback=video.currentTime;
              if(stalledTicks>=3){stalledTicks=0;mediaFailed();}
            }
          }, 5000);
        };
        stream.onmessage = event => {
          if (typeof event.data === 'string') {
            try {
              const data = JSON.parse(event.data);
              if(data.type==='control_result'){const input=document.getElementById('remoteText');if(data.ok&&sentTexts.has(data.id)&&input.value===sentTexts.get(data.id))input.value='';sentTexts.delete(data.id);controlStatus.textContent=data.ok?'تم إرسال الإدخال إلى الكمبيوتر':`تعذّر التحكم: ${data.error}`;return;}
              if(data.type==='ticket' && latest){Object.assign(latest,data);return;}
              if (data.type === 'frame') { pendingFrameInfo = data; pendingPacketInfo = data; }
              else if (data.type === 'audio' || data.type === 'h264' || data.type === 'webm') pendingPacketInfo = data;
              else if (data.type === 'capture_state' && source==='browser' && !data.active) { status.textContent='اضغط أيقونة GPT US في Comet واختر مصدر البث'; message.textContent='لبدء بث Chrome/Comet اضغط أيقونة الإضافة مرة واحدة ثم اختر التبويب أو النافذة أو الشاشة.';screen.classList.remove('ready'); }
              else if (data.type === 'error') { status.textContent = 'خطأ في البث'; message.textContent = data.message; }
            } catch {}
            return;
          }
          if (!pendingPacketInfo) return;
          const packetInfo = pendingPacketInfo; pendingPacketInfo = null;
          if (packetInfo.type === 'audio') { playAudio(event.data, packetInfo); return; }
          if (packetInfo.type === 'h264') { appendVideo(event.data, packetInfo); status.textContent = video.readyState>=2 ? 'H.264 مباشر · صوت متاح' : 'جارٍ فك ترميز أول إطار…'; return; }
          if (packetInfo.type === 'webm') {
            const header=new Uint8Array(event.data,0,Math.min(4,event.data.byteLength));
            const init=packetInfo.segmentStart || (header[0]===0x1a&&header[1]===0x45&&header[2]===0xdf&&header[3]===0xa3);
            if(waitingForInit&&!init){status.textContent='بانتظار بداية الفيديو…';return;}
            waitingForInit=false;
            if(typeof MediaSource==='undefined'){mediaFailed();return;}
            if(videoQueue.length>40){mediaFailed();return;}
            appendWebm(event.data, packetInfo); audioButton.hidden=false;status.textContent=video.readyState>=2 ? "Chrome/Comet مباشر" : "جارٍ فك ترميز أول إطار…";return; }
          if (!pendingFrameInfo || String(pendingFrameInfo.screen) !== source) return;
          const reader = new FileReader();
          reader.onload = () => { frame.src = reader.result; };
          reader.readAsDataURL(new Blob([event.data], { type: pendingFrameInfo.mimeType || 'image/webp' }));
          screen.classList.remove('h264'); screen.classList.add('ready','jpeg');
          const now = performance.now();
          if (lastFrameAt) {
            const sample = 1000 / Math.max(1, now - lastFrameAt);
            measuredFps = measuredFps ? measuredFps * 0.75 + sample * 0.25 : sample;
          }
          lastFrameAt = now;
          status.textContent = `WebSocket مباشر · ${pendingFrameInfo.width}×${pendingFrameInfo.height} · ${measuredFps ? measuredFps.toFixed(1) : '…'} FPS · ${pendingFrameInfo.latencyMs} ms`;
        };
        stream.onerror = () => { status.textContent = 'تعذر فتح قناة البث'; };
        stream.onclose = event => {
          clearInterval(heartbeatTimer); heartbeatTimer = null;
          stream = null;
          if(event.code===4002 || event.code===4004){active=false;clearTimeout(timer);resetVideo();screen.classList.remove('ready');toggle.textContent='متابعة';status.textContent='البث متوقف';message.textContent=event.code===4002?'آخر طلب عرض شاشة هو الجلسة النشطة.':'توقف البث لانقطاع اتصال العرض. اضغط متابعة للاستئناف.';return;}
          if (active) { resetVideo(); schedule(1000); }
        };
      }
      async function refreshConnection() {
        try {
          let result;
          if(window.parent===window && latest?.streamUrl){
            const url=new URL(latest.streamUrl);
            const response=await fetch('/viewer-state?ticket='+encodeURIComponent(url.searchParams.get('ticket')), {cache:'no-store'});
            if(!response.ok){if(response.status===401){active=false;toggle.textContent='متابعة';}throw new Error(response.status===401?'انتهت صلاحية الرابط؛ افتح العرض مجددًا من المحادثة':'تعذر الاتصال بالسيرفر');}
            result=await response.json();
          }else result=await rpc('tools/call', { name: 'live_view_state', arguments: {} });
          configure(result);
          if (!latest?.connected) schedule(3000);
        } catch (error) {
          status.textContent = 'تعذر جلب بيانات الاتصال';
          message.textContent = `${error.message} — إعادة المحاولة تلقائيًا`;
          schedule(3000);
        }
      }
      select.addEventListener('change', () => {
        source = select.value; resetVideo();
        const selectedMonitor=latest?.monitors?.find(m=>String(m.index)===source);
        if(selectedMonitor?.width&&selectedMonitor?.height){screen.style.setProperty('--monitor-ratio',`${selectedMonitor.width} / ${selectedMonitor.height}`);screen.style.setProperty('--monitor-aspect',String(selectedMonitor.width/selectedMonitor.height));}
        else{screen.style.setProperty('--monitor-ratio','16 / 9');screen.style.setProperty('--monitor-aspect','1.7778');}
        lastFrameAt = 0; measuredFps = 0;
        message.textContent = active ? 'جارٍ تبديل الشاشة…' : 'البث متوقف مؤقتًا — اضغط متابعة';
        if (active && stream?.readyState === WebSocket.OPEN) stream.send(JSON.stringify(source==='browser'?{type:'select',source:'browser'}:{ type: 'select', screen: Number(source), mode: 'jpeg' }));
      });
      toggle.addEventListener('click', () => {
        active = !active; toggle.textContent = active ? 'إيقاف مؤقت' : 'متابعة';
        resumeAfterVisibility=false;
        lastFrameAt = 0; measuredFps = 0;
        status.textContent = active ? 'جارٍ الاستئناف…' : 'متوقف مؤقتًا';
        if (active) {
          message.textContent='جارٍ إعادة الاتصال بالبث…';
          resetVideo(); closeStream(); refreshConnection(); return;
        } else {
          clearTimeout(timer);
          if (stream?.readyState === WebSocket.OPEN) stream.send(JSON.stringify({ type: 'pause' }));
          closeStream(); resetVideo(); message.textContent = 'البث متوقف مؤقتًا — اضغط متابعة';
        }
      });
      const paintExpandedMode = () => {
        sizeLive();
        if (expandedMode) document.body.classList.add('expanded'); else document.body.classList.remove('expanded');
        expandButton.textContent = expandedMode ? 'الحجم العادي' : 'تكبير داخل المحادثة';
        window.openai?.notifyIntrinsicHeight?.(document.documentElement.scrollHeight);
      };
      paintExpandedMode();
      // Ask the host to keep the ongoing live session visible above the chat.
      let pinRequested = false;
      const pinLiveView = async () => {
        if (pinRequested) return;
        pinRequested = true;
        try {
          if (window.openai?.requestDisplayMode) {
            await window.openai.requestDisplayMode({ mode: 'inline' });
          } else {
            await rpc('ui/request-display-mode', { mode: 'inline' });
          }
        } catch { pinRequested = false; }
      };
      window.addEventListener('openai:set_globals', pinLiveView);
      pinLiveView();
      expandButton.addEventListener('click', () => {
        expandedMode = !expandedMode;
        paintExpandedMode();
      });
      audioButton.addEventListener('click', async () => {
        if (!audioContext) audioContext = new AudioContext({ latencyHint: 'interactive' });
        audioEnabled = !audioEnabled;
        if (audioEnabled) await audioContext.resume(); else await audioContext.suspend();
        video.muted=!audioEnabled; if(audioEnabled)video.play().catch(()=>{});
        nextAudioTime = 0; audioButton.textContent = audioEnabled ? 'كتم الصوت' : 'تشغيل الصوت';
      });
      function stopLeavingView() {
        active = false; clearTimeout(timer);
        if (stream?.readyState === WebSocket.OPEN) stream.send(JSON.stringify({type:'pause'}));
        closeStream(); resetVideo();
        toggle.textContent='متابعة'; status.textContent='متوقف';
        message.textContent='توقف إرسال الشاشة عند مغادرة العرض. اضغط متابعة للاستئناف.';
      }
      window.addEventListener('pagehide', () => {resumeAfterVisibility=resumeAfterVisibility||active;stopLeavingView();});
      function resumeVisibleView(){
        if(!document.hidden&&resumeAfterVisibility){resumeAfterVisibility=false;active=true;toggle.textContent='إيقاف مؤقت';message.textContent='جارٍ إعادة الاتصال بالبث…';refreshConnection();}
      }
      window.addEventListener('pageshow',resumeVisibleView);
      document.addEventListener('visibilitychange', () => {
        if(document.hidden){resumeAfterVisibility=active;stopLeavingView();}
        else resumeVisibleView();
      });
      configure(window.openai?.toolOutput || window.openai?.toolResponseMetadata || embeddedState);
      // Use the fresh opening-tool state first. If a cached ticket is stale,
      // the WebSocket close handler requests replacement state automatically.
      if (!latest?.connected) refreshConnection();
    })();
  </script>
</body>
</html>
