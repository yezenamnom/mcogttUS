<!doctype html><html><head><meta charset="utf-8"><title>Comet ChatGPT Bridge</title><style>body{font:14px system-ui;max-width:760px;margin:32px auto;padding:0 20px}label{display:block;margin:16px 0 6px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{margin-top:20px;padding:10px 18px}#status{margin-top:14px}</style></head><body><h1>Comet ChatGPT Bridge v0.8</h1><label>Bridge URL</label><input id="url"><label>Bridge token</label><input id="token" type="password" autocomplete="off"><h2>Cursor</h2><div class="row"><div><label>Cursor size</label><input id="cursorSize" type="range" min="18" max="52"></div><div><label>Movement speed</label><input id="cursorSpeed" type="range" min="40" max="300"></div><div><label>Main color</label><input id="cursorColor" type="color"></div><div><label>Click color</label><input id="clickColor" type="color"></div></div><label><input id="cursorEnabled" type="checkbox" style="width:auto"> Show visual cursor</label><label><input id="clickEffect" type="checkbox" style="width:auto"> Show click pulse</label><button id="save">Save & Connect</button><div id="status"></div><script src="options.js"></script></body></html>
